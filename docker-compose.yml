services:
  bot:
    build: .
    command: ["paper"]          # เปลี่ยนเป็น ["live"] เมื่อพร้อม
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    restart: unless-stopped

  dashboard:
    build: .
    command: ["dashboard", "--host", "0.0.0.0", "--port", "8080"]
    env_file: .env              # ต้องตั้ง DASHBOARD_TOKEN
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    ports:
      - "127.0.0.1:8080:8080"   # เปิดเฉพาะเครื่องตัวเอง
    restart: unless-stopped
