[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long market simulations (skip with -m 'not slow')"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "S"]
ignore = ["SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S104", "S105", "S106", "S108", "S310", "E731"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
disable_error_code = ["import-untyped"]
